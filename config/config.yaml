# A股盘后静态分析系统配置文件

# 数据库配置（单环境，E-1 拍平；库名保持 stock_analysis_uat 不变）
database:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: yuzh1234
  database: stock_analysis_uat
  # 连接池配置
  pool:
    enabled: true
    min_connections: 8
    max_connections: 40

# 数据路径配置（C-1 修正：原为搬迁前旧工作区绝对路径，实测不存在；统一为相对仓库根路径）
data_paths:
  csv: data
  vipdoc: data/vipdoc

# 数据源配置
data_sources:
  baostock:
    enabled: true
  tdx_api:
    enabled: true
    base_url: http://127.0.0.1:8080
    timeout: 30
    rate_limit:
      enabled: false
      calls_per_period: 50
      sleep_duration: 1.0

# API限流配置
rate_limit:
  # 是否启用限流
  enabled: true
  # 每个周期的API调用次数限制
  # 设置为0或负数时表示不限流
  calls_per_period: 50
  # 达到限制后的休眠时间（秒）
  sleep_duration: 1.0
  # 重试策略
  retry:
    # 限流异常时的最大重试次数
    max_attempts: 3
    # 重试间隔时间（秒）
    retry_delay: 0.1


# 性能优化配置
performance:

# 稳定性增强配置
stability:
  # 智能重试机制
  retry:
    max_attempts: 5                     # 最大重试次数
    backoff_factor: 2                   # 指数退避因子
    jitter: true                        # 启用抖动避免集中重试
    max_delay: 60                       # 最大延迟时间(秒)

  # 熔断器配置
  circuit_breaker:
    enabled: true
    failure_threshold: 10               # 失败阈值
    recovery_timeout: 60                # 恢复超时时间(秒)
    half_open_max_calls: 5              # 半开状态最大调用数

  # 资源监控配置
  resource_monitor:
    enabled: true
    memory_threshold: 90                # 内存使用阈值(%) (修复: 避免误判，适应macOS内存管理特性)
    cpu_threshold: 85                   # CPU使用阈值(%)
    disk_threshold: 90                  # 磁盘使用阈值(%)
    check_interval: 5                   # 检查间隔(秒) (新增: 减少性能影响)

  # 数据一致性保障
  data_consistency:
    enabled: true
    validation_rules:                   # 数据验证规则
      - check_completeness: true
      - check_consistency: true
      - check_duplicates: true
    transaction_timeout: 30             # 事务超时时间(秒)

# 同步配置
sync:
  batch_size: 1000
  max_retries: 3
  timeout: 30
  kline_max_workers: 8
  kline_stock_batch_size: 1000
  # 日K双源三模式配置（V3.0 方案）
  kline_day_tail_limit: 5                  # 日常增量拉取的尾部条数
  kline_day_tail_window: 10                # 区间起点落在最近N个交易日内时改用tail（避免小范围补齐触发全量拉取）
  kline_day_detect_threshold_abs: 0.01     # 除权检测绝对阈值（元）
  kline_day_detect_threshold_pct: 0.002    # 除权检测相对阈值（占价格比例）
  kline_day_raw_match_tolerance: 0.005     # 原始域不可变校验容差（元）
  # 中间件增强路径开关（V3.0 M-C）：true=qfq走/api/kline-qfq缓存、raw尾部走/api/kline-recent；
  # false=保持 V2.0 直连路径（/api/kline-history + /api/kline-all）。验证通过前保持 false
  kline_day_use_enhanced_api: true
  kline_1min_upsert_batch_size: 2000
  kline_1min_db_max_writers: 4
  kline_1min_staging_batch_size: 20000
  kline_1min_merge_optimized_enabled: true
  kline_1min_merge_batch_size: 1000
  kline_1min_csv_max_workers: 2
  kline_1min_csv_max_queue: 20000
  kline_anomaly_report_limit: 5000
  kline_1min_copy_enabled: true
  kline_1min_staging_unlogged: false
  kline_1min_pipeline_enabled: true
  kline_1min_partition_cleanup: truncate
  kline_1min_partition_batch_size: 5000
  kline_1min_pipeline_queue_size: 200
  kline_1min_pipeline_fetch_workers: 8
  kline_1min_pipeline_normalize_workers: 8
  kline_1min_pipeline_write_workers: 4
  # 动态批次大小配置
  batch_sizes:
    stock_info: 2000      # 股票信息字段多
  # 基本面重刷防封禁配置（baostock 黑名单；2026-09-07 17:05 由 0.25/300 上调）
  # 注意：键必须位于 sync 段下，代码读取路径为 sync.fundamentals_rebuild_call_sleep
  fundamentals_rebuild_call_sleep: 0.6     # 每次季度调用间隔（秒）
  fundamentals_rebuild_recycle_calls: 1000 # 每 N 次调用回收会话（重新登录）

# 技术分析链配置（doc/技术分析链方案设计.MD）
analysis:
  # CSV / 进度文件 / 运行元信息输出目录（相对仓库根 stock_yuzh/，或绝对路径）
  output_dir: data/analysis
  # 分析窗口（仅加载锚定日往前多久的日K线）由「链 YAML 的 lookback 字段」决定，
  # 默认 1y；此处不重复配置，避免两处口径冲突。
  # 前复权断裂判定容差（百分点）：|change_rate| > 制度上限 + 容差 即判为断裂
  break_tolerance_pct: 0.6
  # 是否执行「缺行」检测
  check_missing_day: true
  # 缺行分流模式：
  #   gap = 只把「孤立单日缺行」判为存疑；连续≥2交易日缺行按疑似停牌处理（不计存疑，仅记入 meta）
  #   all = 方案原文行为，所有交易日缺行都判为存疑
  #   off = 不做缺行检测
  missing_day_mode: gap
  # 进度输出间隔：每 N 只股票 或 每 M%，先到者为准
  progress_interval_stocks: 200
  progress_interval_percent: 5.0

# CSV文件管理配置
csv:
  file_management:
    # 默认文件管理模式: overwrite(覆盖)，符合产品设计文档要求
    mode: overwrite
    # 备份配置 - 根据产品设计文档要求，不需要备份机制
    backup:
      enabled: false
      directory: .backup
      max_files: 10
    # 按数据类型的特定设置 - 统一配置为覆盖模式
    per_type_settings:
      # 所有数据类型统一使用覆盖模式，符合"先删除已存在文件"要求
      base_stock_info:
        mode: overwrite
      base_fundamentals_info:
        mode: overwrite
  # （基本面重刷防封禁配置已移至 sync 段，见上方 sync.fundamentals_rebuild_call_sleep）
