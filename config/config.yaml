# A股盘后静态分析系统配置文件

# 数据库配置（单环境，E-1 拍平；库名保持 stock_analysis_uat 不变）
database:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: yuzh1234
  database: stock_analysis_uat
  # 连接池配置
  pool:
    enabled: true
    min_connections: 8
    max_connections: 40

# 数据路径配置（C-1 修正：原为搬迁前旧工作区绝对路径，实测不存在；统一为相对仓库根路径）
data_paths:
  csv: data
  vipdoc: data/vipdoc

# 数据源配置
data_sources:
  # baostock 已于 2026-10-25 下线（交易日历/股本/股票列表全部切换 tdx-api，
  # 见 doc/数据源迁移方案-baostock下线-V1.0-20261025.md）
  tdx_api:
    enabled: true
    base_url: http://127.0.0.1:8080
    timeout: 30
    rate_limit:
      enabled: false
      calls_per_period: 50
      sleep_duration: 1.0

# API限流配置
rate_limit:
  # 是否启用限流
  enabled: true
  # 每个周期的API调用次数限制
  # 设置为0或负数时表示不限流
  calls_per_period: 50
  # 达到限制后的休眠时间（秒）
  sleep_duration: 1.0
  # 重试策略
  retry:
    # 限流异常时的最大重试次数
    max_attempts: 3
    # 重试间隔时间（秒）
    retry_delay: 0.1


# （performance/stability 配置段已随 C-3 删除：全仓零代码消费）

# 同步配置
sync:
  batch_size: 1000
  max_retries: 3
  timeout: 30
  kline_max_workers: 8
  kline_stock_batch_size: 1000
  # 日K双源三模式配置（V3.0 方案）
  kline_day_tail_limit: 5                  # 日常增量拉取的尾部条数
  kline_day_tail_window: 10                # 区间起点落在最近N个交易日内时改用tail（避免小范围补齐触发全量拉取）
  kline_day_detect_threshold_abs: 0.01     # 除权检测绝对阈值（元）
  kline_day_detect_threshold_pct: 0.002    # 除权检测相对阈值（占价格比例）
  kline_day_raw_match_tolerance: 0.005     # 原始域不可变校验容差（元）
  # raw 兜底（日K线raw兜底与自动恢复方案 V1.0）：qfq 尾部缺口（THS 未发布）时用 raw 值兜底，
  # 行级标记 source='TDXAPI_RAWFB'，台账 kline_day_raw_fallback 追踪，恢复阶段自动销账
  kline_day_raw_fallback:
    enabled: true                          # 总开关（除权校验始终强制执行，不受此开关影响）
    max_stocks_per_run: 1500               # 单次运行兜底股票数上限（防系统性故障时异常放大）
    # ---- 批次2（数据采集链路耗时优化技术方案 V1.1 §4，2026-11-20）：恢复扫描拆分 ----
    embedded_recover: auto                 # 内嵌恢复执行范围：auto=仅全市场日常增量执行（定向补股/显式区间/init 不再扫全台账，改由独立恢复作业领取）；on=总是执行（旧行为）；off=完全停用（独立作业验证后切换）
    recover_max_stocks: 500                # 独立恢复作业（recover-kline-raw-fallback）单批股票数预算
    recover_budget_seconds: 600            # 独立恢复作业墙钟预算（到预算停止发起新请求）
    recover_backoff_seconds: 1800          # 未发布/拉取失败记录的退避秒（到期可重领）
  # ---- 批次4（方案 V1.1 §3.2）：日K行情可用性预检（真实 qfq tail 代表标的，只留痕不阻断）----
  kline_day_preflight:
    representatives: sh600519,sz000001     # 沪/深代表标的（北交所自动从本次股票清单取一只）
  # ---- 数据采集链路风险修复（方案 V1.0，2026-11-18）----
  tdx_strict_mode: true                    # F8 strict 总开关：中间件连接/业务失败在行情主路径抛 TdxApiUnavailableError（false=退回旧行为返回空）
  kline_day_replace_min_ratio: 0.9         # F3 整股替换完整性：新行数 < 旧行数×比值时拒绝替换（0=关闭校验）
  kline_day_circuit_breaker: 20            # F5 连续 conn 类失败股票数熔断阈值（仅连接层错误计数，业务错误不计）
  stock_list_snapshot_min: 3000            # F6 股票快照下限：低于则中止本轮维护（缺席计数/退市判定/落库均不执行）
  # 中间件增强路径开关（V3.0 M-C）：true=qfq走/api/kline-qfq缓存、raw尾部走/api/kline-recent；
  # false=保持 V2.0 直连路径（/api/kline-history + /api/kline-all）。验证通过前保持 false
  kline_day_use_enhanced_api: true
  kline_1min_db_max_writers: 4
  kline_1min_csv_max_workers: 2
  kline_1min_csv_max_queue: 20000
  kline_anomaly_report_limit: 5000
  kline_1min_pipeline_enabled: true
  kline_1min_partition_cleanup: truncate
  kline_1min_partition_batch_size: 5000
  kline_1min_pipeline_queue_size: 200
  kline_1min_pipeline_fetch_workers: 8
  kline_1min_pipeline_normalize_workers: 8
  kline_1min_pipeline_write_workers: 4
  # 动态批次大小配置
  batch_sizes:
    stock_info: 2000      # 股票信息字段多
  # XDXR 股本采集与股票列表维护（baostock 下线换源 2026-10-25）
  shares_xdxr_interval: 0.1               # XDXR 股本采集请求间隔（秒）
  stock_list_delist_absent_days: 5        # 退市判定：缺席快照次数阈值
  stock_list_delist_stale_days: 90        # 退市判定：最后日K停更天数阈值

# 财报PDF采集配置（巨潮资讯网，安全红线：串行限速、正常UA、不破解、仅自用）
cninfo:
  query_base_url: http://www.cninfo.com.cn
  static_base_url: http://static.cninfo.com.cn
  timeout: 30
  query_interval: 0.5      # 检索接口请求间隔（秒）
  download_interval: 0.5   # PDF下载间隔（秒）
  page_size: 30
  max_pages_per_window: 200 # 单检索窗口分页上限（超过自动对半拆窗；单日窗口无法拆分。
                           # 80 不够：探路 T18 实测年报截止日 4-30 单日 2703 条≈91 页，
                           # K 回补实测这些窗口全部失败→年报期披露日缺口（2026-10-03 修）
                           # 120 不够：2026-10-28（Q3 披露截止 10-31 前冲刺）单日 4501 条≈151 页
                           # 失败→披露日缺口；深分页实测 page 60~151 稳定、同页两次一致（2026-10-31 修）
                           # 160 仍不够：2026-10-30（Q3 截止前最后交易日）单日 5469 条≈183 页→200（2026-10-31 修）
  backfill_years: 5        # 无进度股票的默认回补年数（报告期口径；pdf_recent_years>0 时被其取代）
  pdf_recent_years: 10     # 仅采集/保留近 N 个报告年度（滚动窗口，2026 → 报告期 2017 起；0=全历史。
                           # 用户决策 2026-10-01：磁盘余量不足 150G，缩范围至近 10 年；
                           # 存量早年文件由 scripts/prune_financial_pdf.py 清理）
  pdf_dir: data/financial_pdf  # PDF落盘根目录（相对仓库根 stock_yuzh/，或绝对路径）

# 技术分析链配置（doc/技术分析链方案设计.MD）
analysis:
  # CSV / 进度文件 / 运行元信息输出目录（相对仓库根 stock_yuzh/，或绝对路径）
  output_dir: data/analysis
  # 分析窗口（仅加载锚定日往前多久的日K线）由「链 YAML 的 lookback 字段」决定，
  # 默认 1y；此处不重复配置，避免两处口径冲突。
  # 前复权断裂判定容差（百分点）：|change_rate| > 制度上限 + 容差 即判为断裂
  break_tolerance_pct: 0.6
  # 是否执行「缺行」检测
  check_missing_day: true
  # 缺行分流模式：
  #   gap = 只把「孤立单日缺行」判为存疑；连续≥2交易日缺行按疑似停牌处理（不计存疑，仅记入 meta）
  #   all = 方案原文行为，所有交易日缺行都判为存疑
  #   off = 不做缺行检测
  missing_day_mode: gap
  # 进度输出间隔：每 N 只股票 或 每 M%，先到者为准
  progress_interval_stocks: 200
  progress_interval_percent: 5.0

# （CSV 文件管理模式配置段已随 RK-3 方案A 删除：CsvFileManager 模式体系零消费，
#  实际行为恒为 _write_csv_file 硬编码"存在即删除"）

# ---- 每日复盘报告层配置（复盘报告层与 P0 修复技术方案-V1.0-20260930 §5.6）----
review:
  output_dir: doc/reports       # 报告输出目录（相对仓库根 stock_yuzh/，或绝对路径）
  top_n: 20                     # 明细表行数上限
  volume_surge_min: 2.0         # 放量大涨入选倍数
  industry_sources: [sw_2021, sina_hy]   # 行业映射优先级（sw_2021 缺失股回退 sina_hy）
  # 资金锚质量标签规则（P1-6；实测=表内直取 / 代理=关联量替代 / 停旧值=快照日期早于
  # 锚定日一律覆盖；north_detail 披露止于 20240816 恒为停旧值，不参与综合置信度）
  money_anchor_tags:
    south_net: 实测        # 南向净买入（Buy−Sell 真净额）
    north_total: 代理      # 北向成交总额（只披露成交额，作外资活跃度代理）
    etf: 代理              # ETF 份额变动（资金方向的代理读数）
    macro: 实测            # 宏观指标（官方发布值）
    option: 实测           # ETF 期权 PC 率/OI（交易所披露）
    north_detail: 停旧值   # 北向个股明细（披露止于 20240816）
  # 缠论池情绪联动规则（P1-8；digest 缠论节状态行渲染）。
  # 规则理由：回暖/震荡期新确认一买=逆势新低弱股（降权）；冰点/退潮期一买=
  # 深度洗脱后的左侧点（升主关注）；高潮期左侧池仅记录不占用注意力
  chan_pool_linkage:
    回暖: 弱化观察
    震荡: 弱化观察
    冰点: 升主关注
    退潮: 升主关注
    高潮: 仅记录
  # E 项题材归因黑名单（宽基属性/非题材概念，子串匹配剔除；方案 4.5 降噪）
  theme_exclude_concepts: ['融资融券', '深股通', '沪股通', 'MSCI', '标普道琼斯', '富时罗素',
                           '转融券', '预盈预增', '预亏预减', '机构重仓', '基金重仓',
                           '社保重仓', 'QFII重仓']
  # 情绪判据：2026-10-03 校准定稿（依据 data/reports/sentiment_calibration_20261003_002902.md，
  # 1149 对样本；高潮由 ≥6板/≥5% 降档为 ≥5板/≥4%——命中 39→109 天、区分度保持，
  # 解决兜底态占 66.8% 的过严问题；冰点/退潮维持；判据定位=情绪状态描述而非次日预测）
  sentiment_calibrated: true
  sentiment_rules:              # 命中顺序：高潮 → 冰点 → 退潮 → 回暖/震荡（复盘框架.MD §3）
    ice: {max_streak_lte: 2, burst_rate_gte: 0.5}      # 冰点：高度≤2 或 炸板率≥50%
    ebb: {premium_mean_lte: 0}                          # 退潮：昨日涨停溢价均值≤0
    climax: {max_streak_gte: 5, premium_mean_gte: 4.0, breadth_ratio_gte: 2.5}  # 高潮：高度≥5 且 溢价≥4%；市场宽度（涨跌家数比，独立于涨停 cohort）2026-10-28 校准升格定位判据（阈值 2.0→2.5，依据 data/calibration/breadth_calibration_20261026_0024.md：ge2.5 非高潮日次日溢价 2.44% vs 基线 1.95%）——形态=非高潮日宽度达标记「偏暖」标注，档名/候选联动不变；2026-10-27 前为 2.0 参考口径（不参与定位）
  # 转天交易预案（第六章子节）判据初版：2026-10-05 新增，阈值待用户校准定稿
  # （流程同情绪判据 §3；用途=条件-动作参考框架，非次日涨跌预测）
  tomorrow_plan:
    overseas_gap_pct: 1.5       # 盘前外围情景分档：恒指/纳指较锚定日收盘 ±1.5% 触发 P1/P3
    volume_band_pct: 20         # 盘中量能验证分档：转天成交额较今日基准 ±20%
    # 买入候选规则（判据初版；R1 梯队接力 / R2 主线跟随 / R3 趋势新高 / R4 机构席位，
    # 与情绪周期联动开放：高潮仅 R1，冰点/退潮不开放；每类带确认/否决/风控决策树）
    buy_rules:
      money_confirm: false      # 资金确认过滤（R2/R3 要求当日大单净流入>0）默认关，观察期回测后开
      r1_min_streak: 2          # R1：连板高度下限
      r1_max_reopen: 2          # R1：开板次数上限（封板质量；分笔缺失视为通过并标注）
      r3_volume_min: 2.0        # R3：放量倍数下限
      r3_change_min: 3.0        # R3：当日涨幅下限（%）
      top_n: 5                  # 每类候选上限
      veto_high_board_lookback: 3  # 反抽板 veto：近 N 日高位板放量长阴（P4-1 语义修订，初版未校准）

# ---- 缠论输入完整性门控（P0-7，2026-10-24）----
# 报告层 _aggregate_chan 读取；链侧 chan_divergence_buy 参数 min_coverage
# （daily_review.yaml）须与本值保持一致（两入口同口径）
chan:
  min_coverage: 0.98    # 窗口覆盖率下限：低于 → insufficient 不判定；[下限,1) 打缺日标记保留

# ---- 每日复盘数据采集配置（每日复盘数据采集技术方案-V1.0-20260927）----
# 合规红线：串行限速、正常 UA/Referer、不破解任何技术措施（含同花顺 hexin-v）、
# 风控识别即退避冷却、仅自用不分发。频率预算见方案 §8.1，全部参数来自本段，无硬编码。
review_sync:
  # 通用（http_collector_base）
  default_timeout: [5, 30]        # 连接5s/读30s
  blocked_cooldown_seconds: 1800  # 风控急停冷却（20261117 600→1800：交易所 403 封禁为小时级，600s 重试必失败且多暴露一次；单源冷却占用一个 worker 槽，其余源不受阻）
  # ---- 批次3（方案 V1.1 §5.1，2026-11-20）：补采接管冷却——主流程不再原地 sleep ----
  pending_handoff_enabled: true   # true=风控急停登记持久化待补（sync_collection_retry）后立即释放工作线程，由 sync-review-pending 按到期领取；false=回退旧行为（冷却 sleep 后重试一次，§6 回滚开关）
  pending_lag_retry_seconds: 300  # "待补（数据日滞后）"类缺口的补采重试间隔秒（急停/失败类用 blocked_cooldown_seconds）
  # ---- 限流优化第一批（第三方数据采集限流与补采优化方案 20261120 §2/§3）----
  domain_gate_enabled: false      # 请求级准入域门（DB 共享冷却/节拍/时隙）：缺省 false=仅本地节拍（代码先行、配置灰度，§5 发布顺序）；true 后按实际外发主机共享冷却（szse/sse/cninfo_query/cninfo_static/sina_vip/ths_basic/csindex 等），旧 exchange 域冷却记录在过期前仍被识别
  sina_recheck_budget: 12         # 新浪板块整轮复核预算（数量不足/异常缩减重抓共享，防软限流下空页循环放大请求）
  retry_attempts: 3               # 网络类异常重试次数（风控信号不重试）
  # ---- 数据采集链路风险修复（方案 V1.0，2026-11-18）----
  freshness_check_enabled: true   # F1 数据新鲜度巡检（编排末尾自动跑；独立 CLI sync-freshness-check）
  # freshness_rules:               # F1 规则可覆盖缺省 18 表规则，格式：
  #   - {table: his_kline_day, date_column: trade_date, freq: daily, max_lag_days: 3, label: 全市场日K}
  data_date_check_enabled: true   # F2 "成功≠有当日数据"校验（源自报 data_date_max < 基准日 → 降级待补）
  middleware_health_check_enabled: true  # F4 中间件健康预检（请求集含 tdx 依赖源时调度前统一预检）
  kline_gate_min_rows: 3000       # F9 日K门控：当日行数下限
  kline_gate_min_ratio: 0.95      # F9 日K门控：当日/前日行数比下限（原 0.8 过宽，11-17 放行 697 漏采）
  kline_gate_max_abs_diff: 300    # F9 日K门控：|当日-前日| 行数绝对差上限
  # （F16 告警推送已按用户要求整体移除，2026-11-18：汇总报告仍是唯一出口，
  #  静默缺口依赖 F1 巡检报告人工查看）
  # user_agent: 可覆盖默认 UA（与 cninfo 现用同款策略）
  # bypass_proxy: false           # 默认外网走系统代理；true 显式绕过
  # 各源请求间隔（秒）
  index_interval: 0.2
  factor_interval: 2.0
  cninfo_interval: 0.5            # 沿用现有 cninfo.query_interval 口径
  sse_szse_interval: 3.0                    # 20261004 深夜 1.5→3.0：回补重启降风控力度（szse 曾 IP 拒绝）
  csindex_interval: 2.0
  ths_interval: 2.0
  sina_interval: 1.0
  sina_sector_interval: 2.0     # 新浪 vip 板块接口（行业分类/概念成分，缺失数据采集方案 20260928）
  sw_interval: 5.0              # 申万一级行业分类文件（swsresearch 下载中心，31+1 请求/次）
  tdx_official_interval: 2.0    # 通达信官网盘后包（北交所日K/全市场对拍，每交易日仅 1 请求）
  # 源间并发（用户决策 2026-09-27）：依赖驱动调度（2026-11-01 升级）——各源声明依赖，
  # 依赖完成即提交（THS 只等公告/披露、与日K并行）；各源内部仍按各自限速节奏执行。
  # 外网源源内并发仅 THS 财报放开（用户拍板 2026-11-01，并发 2 保守起步）；
  # tdx 本地源（日K/资金流）无风控语义，节拍/线程独立调优。
  parallel_sources: true
  parallel_workers: 4            # 同时运行的源数上限（依赖就绪队列）
  # 市场要闻（四期方案 §4 2026-10-07）：新浪 7x24 快讯公开接口（无签名）
