# A股盘后静态分析系统配置文件

# 数据库配置（单环境，E-1 拍平；库名保持 stock_analysis_uat 不变）
database:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: yuzh1234
  database: stock_analysis_uat
  # 连接池配置
  pool:
    enabled: true
    min_connections: 8
    max_connections: 40

# 数据路径配置（C-1 修正：原为搬迁前旧工作区绝对路径，实测不存在；统一为相对仓库根路径）
data_paths:
  csv: data
  vipdoc: data/vipdoc

# 数据源配置
data_sources:
  baostock:
    enabled: true
  tdx_api:
    enabled: true
    base_url: http://127.0.0.1:8080
    timeout: 30
    rate_limit:
      enabled: false
      calls_per_period: 50
      sleep_duration: 1.0

# API限流配置
rate_limit:
  # 是否启用限流
  enabled: true
  # 每个周期的API调用次数限制
  # 设置为0或负数时表示不限流
  calls_per_period: 50
  # 达到限制后的休眠时间（秒）
  sleep_duration: 1.0
  # 重试策略
  retry:
    # 限流异常时的最大重试次数
    max_attempts: 3
    # 重试间隔时间（秒）
    retry_delay: 0.1


# （performance/stability 配置段已随 C-3 删除：全仓零代码消费）

# 同步配置
sync:
  batch_size: 1000
  max_retries: 3
  timeout: 30
  kline_max_workers: 8
  kline_stock_batch_size: 1000
  # 日K双源三模式配置（V3.0 方案）
  kline_day_tail_limit: 5                  # 日常增量拉取的尾部条数
  kline_day_tail_window: 10                # 区间起点落在最近N个交易日内时改用tail（避免小范围补齐触发全量拉取）
  kline_day_detect_threshold_abs: 0.01     # 除权检测绝对阈值（元）
  kline_day_detect_threshold_pct: 0.002    # 除权检测相对阈值（占价格比例）
  kline_day_raw_match_tolerance: 0.005     # 原始域不可变校验容差（元）
  # 中间件增强路径开关（V3.0 M-C）：true=qfq走/api/kline-qfq缓存、raw尾部走/api/kline-recent；
  # false=保持 V2.0 直连路径（/api/kline-history + /api/kline-all）。验证通过前保持 false
  kline_day_use_enhanced_api: true
  kline_1min_db_max_writers: 4
  kline_1min_csv_max_workers: 2
  kline_1min_csv_max_queue: 20000
  kline_anomaly_report_limit: 5000
  kline_1min_pipeline_enabled: true
  kline_1min_partition_cleanup: truncate
  kline_1min_partition_batch_size: 5000
  kline_1min_pipeline_queue_size: 200
  kline_1min_pipeline_fetch_workers: 8
  kline_1min_pipeline_normalize_workers: 8
  kline_1min_pipeline_write_workers: 4
  # 动态批次大小配置
  batch_sizes:
    stock_info: 2000      # 股票信息字段多
  # 基本面重刷防封禁配置（baostock 黑名单；2026-09-07 17:05 由 0.25/300 上调）
  # 注意：键必须位于 sync 段下，代码读取路径为 sync.fundamentals_rebuild_call_sleep
  fundamentals_rebuild_call_sleep: 0.6     # 每次季度调用间隔（秒）
  fundamentals_rebuild_recycle_calls: 1000 # 每 N 次调用回收会话（重新登录）

# 财报PDF采集配置（巨潮资讯网，安全红线：串行限速、正常UA、不破解、仅自用）
cninfo:
  query_base_url: http://www.cninfo.com.cn
  static_base_url: http://static.cninfo.com.cn
  timeout: 30
  query_interval: 0.5      # 检索接口请求间隔（秒）
  download_interval: 0.5   # PDF下载间隔（秒）
  page_size: 30
  max_pages_per_window: 40 # 单检索窗口分页上限（超过自动对半拆窗）
  backfill_years: 5        # 无进度股票的默认回补年数（报告期口径）
  pdf_dir: data/financial_pdf  # PDF落盘根目录（相对仓库根 stock_yuzh/，或绝对路径）

# 技术分析链配置（doc/技术分析链方案设计.MD）
analysis:
  # CSV / 进度文件 / 运行元信息输出目录（相对仓库根 stock_yuzh/，或绝对路径）
  output_dir: data/analysis
  # 分析窗口（仅加载锚定日往前多久的日K线）由「链 YAML 的 lookback 字段」决定，
  # 默认 1y；此处不重复配置，避免两处口径冲突。
  # 前复权断裂判定容差（百分点）：|change_rate| > 制度上限 + 容差 即判为断裂
  break_tolerance_pct: 0.6
  # 是否执行「缺行」检测
  check_missing_day: true
  # 缺行分流模式：
  #   gap = 只把「孤立单日缺行」判为存疑；连续≥2交易日缺行按疑似停牌处理（不计存疑，仅记入 meta）
  #   all = 方案原文行为，所有交易日缺行都判为存疑
  #   off = 不做缺行检测
  missing_day_mode: gap
  # 进度输出间隔：每 N 只股票 或 每 M%，先到者为准
  progress_interval_stocks: 200
  progress_interval_percent: 5.0

# （CSV 文件管理模式配置段已随 RK-3 方案A 删除：CsvFileManager 模式体系零消费，
#  实际行为恒为 _write_csv_file 硬编码"存在即删除"）

# ---- 每日复盘数据采集配置（每日复盘数据采集技术方案-V1.0-20260927）----
# 合规红线：串行限速、正常 UA/Referer、不破解任何技术措施（含同花顺 hexin-v）、
# 风控识别即退避冷却、仅自用不分发。频率预算见方案 §8.1，全部参数来自本段，无硬编码。
review_sync:
  # 通用（http_collector_base）
  default_timeout: [5, 30]        # 连接5s/读30s
  blocked_cooldown_seconds: 600   # 风控急停冷却
  retry_attempts: 3               # 网络类异常重试次数（风控信号不重试）
  # user_agent: 可覆盖默认 UA（与 cninfo 现用同款策略）
  # bypass_proxy: false           # 默认外网走系统代理；true 显式绕过
  # 各源请求间隔（秒）
  index_interval: 0.2
  factor_interval: 2.0
  cninfo_interval: 0.5            # 沿用现有 cninfo.query_interval 口径
  sse_szse_interval: 1.5
  csindex_interval: 2.0
  ths_interval: 2.0
  sina_interval: 1.0
  sina_sector_interval: 2.0     # 新浪 vip 板块接口（行业分类/概念成分，缺失数据采集方案 20260928）
  sw_interval: 5.0              # 申万一级行业分类文件（swsresearch 下载中心，31+1 请求/次）
  # 源间并发（用户决策 2026-09-27）：独立源波次并行，各源内部仍串行限速
  parallel_sources: true
  parallel_workers: 4            # 波内并发源数上限
  # 分笔资金流（tdx 本地，并发≤3 灰度起步）
  money_flow:
    concurrent_workers: 3
    request_interval: 0.15
    big_amount_threshold: 500000  # 大单阈值（元）
    top_amount_n: 50              # 成交额 Top N
    pct_threshold: 0.07           # 涨跌幅异动阈值（|change_rate|≥7%，百分点 7 对应 7%）
    gray_limit: 200               # 灰度期子集上限（稳定后放开 500）
    throttle_on_timeout_pct: 0.05 # 超时率阈值，触发自动降速（间隔×2）
  margin_lookback_days: 5        # 两融发布滞后回看天数（深所周末期间周中数据延迟可见）
  # THS 财报（探路结论为"不可行"时置 false，报告章节标待补；三项 THS 源共用探路结论）
  ths_finance:
    enabled: true
    backfill_years: 5
  concept:
    enabled: true
  # 行业分类（缺失数据采集方案 20260928 §3；主源新浪行业板块 source=sina_hy 日更）
  industry:
    enabled: true
    sw_enabled: true            # 申万 2021 一级增强口径 source=sw_2021（下载中心探路已通过）
  unlock:
    enabled: true
    # 巨潮解禁公告路径（缺失数据采集方案 20260928 §5）：searchkey 窗口检索 -> 标题过滤 -> PDF 解析
    searchkeys: ['限售股上市流通', '解除限售']
    pdf_extract_max_pages: 3    # 解禁日一般在首页，向后多翻 2 页兜底
    days_back: 3                # 日频增量回看天数（游标存在时取更近下界）
  weekly_refresh_weekday: 6       # 周日（0=周一）跑概念/解禁
  # 指数清单（code: 6位指数代码, ts_code: 库内主键, name: 简称, exchange: 所属所）
  indices:
    - {code: "000001", ts_code: sh.000001, name: 上证指数, exchange: sse}
    - {code: "399001", ts_code: sz.399001, name: 深证成指, exchange: szse}
    - {code: "399006", ts_code: sz.399006, name: 创业板指, exchange: szse}
    - {code: "000688", ts_code: sh.000688, name: 科创50, exchange: sse}
    - {code: "000300", ts_code: sh.000300, name: 沪深300, exchange: sse}
    - {code: "899050", ts_code: bj.899050, name: 北证50, exchange: bse}
  # 中证指数估值关注清单（官网每日 indicator 文件；中证仅发布其管理指数，
  # 深交所指数（创业板指 399006 等）无文件 → 不入清单，实施时已实测）
  csindex_indices:
    - {code: "000300", name: 沪深300}
    - {code: "000905", name: 中证500}
    - {code: "000852", name: 中证1000}
    - {code: "000001", name: 上证指数}
    - {code: "000688", name: 科创50}
  # 新浪外围市场清单（补充代码确认返回格式后增删，配置化）
  sina_markets:
    - {code: int_dji, name: 道琼斯}
    - {code: int_nasdaq, name: 纳斯达克}
    - {code: int_sp500, name: 标普500}
    - {code: rt_hkHSI, name: 恒生指数}
    - {code: fx_susdcny, name: 美元兑人民币}
  # 巨潮公告 ann_type 标题分类词表（供复盘按类筛选，不做全文解析）
  announcement_types:
    定期报告: ['年度报告', '半年度报告', '中期报告', '季度报告', '一季度报告', '三季度报告']
    业绩预告: ['业绩预告', '预增', '预减', '扭亏', '首亏', '续盈', '续亏', '略增', '略减']
    业绩快报: ['业绩快报']
    解禁: ['上市流通', '解除限售']
    分红送转: ['分红', '派息', '送转', '权益分派', '利润分配']
    增减持: ['增持', '减持', '增持计划', '减持计划']
    重大事项: ['重大资产重组', '停牌', '复牌', '收购', '发行股份', '要约收购', '重大合同', '中标']
