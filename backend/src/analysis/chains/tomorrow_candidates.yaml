# 分析链：转天买入候选（报告层第六章预案的链侧全量底表）
#
# 与报告层（review/sections/tomorrow_plan.py）同规则同口径（candidate_rules 谓词
# 共用）：R1 梯队接力 / R2 主线跟随 / R3 趋势新高 / R4 机构席位，去重优先级
# R1 > R2 > R3 > R4。报告层按情绪开放度（高潮仅 R1 / 冰点退潮不开放）截取
# top_n 展示；本链输出全量命中底表（不截断、不做情绪联动），解读层按当日
# 情绪定位过滤视图。
#
# 模块顺序 = 执行顺序（R 系列读前置模块结果，顺序不可调换）；
# env: a_share_candidates 装配封板/概念/聚集/机构截面查表（env_assembly）。
#
# 运行：backend/run_cli.py analyze run --chain tomorrow_candidates [--as-of yyyyMMdd]

chain: tomorrow_candidates
description: 转天买入候选链：R1梯队接力/R2主线跟随/R3趋势新高/R4机构席位（与报告层预案同规则，全量底表）

lookback: 60d
env: a_share_candidates

modules:
  - name: limit_up_today          # 是否涨停（锚定日；R 系列锚定日口径参考）
  - name: consecutive_limit_up    # 连板数（R1/R2 前置）
    params: {max_lookback: 60}
  - name: volume_surge            # 放量倍数（R3 前置）
  - name: new_high_low            # 60日新高新低（R3 前置）
    params: {window: 60}
  - name: r1_ladder_relay         # R1 梯队接力候选（连板 + 封板质量）
  - name: r2_mainline_follow      # R2 主线跟随候选（首板 × 聚集前列概念）
  - name: r3_trend_new_high       # R3 趋势新高候选（新高 × 放量 × 强势）
  - name: r4_institution_seat     # R4 机构席位候选（机构净买前 5）
